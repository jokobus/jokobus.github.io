<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" height="auto" class="tikz-svg" style="background: transparent; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    
  <style>
    .stroke-main { stroke: #0f172a; }
    .fill-main { fill: #0f172a; }
    .stroke-axis { stroke: #64748b; }
    .fill-axis { fill: #64748b; }
    .stroke-cyan { stroke: #0284c7; }
    .fill-cyan { fill: #0284c7; }
    .stroke-orange { stroke: #ea580c; }
    .fill-orange { fill: #ea580c; }
    .stroke-purple { stroke: #9333ea; }
    .fill-purple { fill: #9333ea; }
    .plate-fill { fill: #0284c7; fill-opacity: 0.06; }
    .dam-fill { stroke: #0284c7; stroke-opacity: 0.35; }

    :root[data-theme="dark"] .stroke-main,
    @media (prefers-color-scheme: dark) {
      .stroke-main { stroke: #f1f5f9; }
      .fill-main { fill: #f1f5f9; }
      .stroke-axis { stroke: #94a3b8; }
      .fill-axis { fill: #94a3b8; }
      .stroke-cyan { stroke: #00f0ff; }
      .fill-cyan { fill: #00f0ff; }
      .stroke-orange { stroke: #fb923c; }
      .fill-orange { fill: #fb923c; }
      .stroke-purple { stroke: #c084fc; }
      .fill-purple { fill: #c084fc; }
      .plate-fill { fill: #00f0ff; fill-opacity: 0.08; }
      .dam-fill { stroke: #00f0ff; stroke-opacity: 0.4; }
    }
    :root[data-theme="light"] .stroke-main { stroke: #0f172a; }
    :root[data-theme="light"] .fill-main { fill: #0f172a; }
    :root[data-theme="light"] .stroke-axis { stroke: #64748b; }
    :root[data-theme="light"] .fill-axis { fill: #64748b; }
    :root[data-theme="light"] .stroke-cyan { stroke: #0284c7; }
    :root[data-theme="light"] .fill-cyan { fill: #0284c7; }
    :root[data-theme="light"] .stroke-orange { stroke: #ea580c; }
    :root[data-theme="light"] .fill-orange { fill: #ea580c; }
    :root[data-theme="light"] .stroke-purple { stroke: #9333ea; }
    :root[data-theme="light"] .fill-purple { fill: #9333ea; }
    :root[data-theme="light"] .plate-fill { fill: #0284c7; fill-opacity: 0.06; }
    :root[data-theme="light"] .dam-fill { stroke: #0284c7; stroke-opacity: 0.35; }
  </style>

    <pattern id="dam-hatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" class="dam-fill" stroke-width="1.5"/>
    </pattern>
    <marker id="arr-axis-4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="fill-axis"/>
    </marker>
    <marker id="arr-cyan-4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="fill-cyan"/>
    </marker>
    <marker id="arr-orange-4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="fill-orange"/>
    </marker>
    <marker id="arr-purple-4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="fill-purple"/>
    </marker>
  </defs>

  <!-- Dam Triangle
       A (Crest, right-top): (460, 80)
       B (Toe, right-bottom): (460, 360)
       C (Heel, left-bottom): (180, 360)
  -->
  <polygon points="460,80 460,360 180,360" fill="url(#dam-hatch)" class="stroke-cyan" stroke-width="2.5"/>

  <!-- Vertices labels -->
  <text x="465" y="70" class="fill-cyan" font-size="18" font-weight="700">A</text>
  <text x="470" y="375" class="fill-cyan" font-size="18" font-weight="700">B</text>
  <text x="165" y="375" class="fill-cyan" font-size="18" font-weight="700">C</text>

  <!-- Axes origin near A -->
  <g transform="translate(460, 45)">
    <line x1="0" y1="0" x2="-70" y2="0" class="stroke-axis" stroke-width="2" marker-end="url(#arr-axis-4)"/>
    <line x1="50" y1="35" x2="50" y2="105" class="stroke-axis" stroke-width="2" marker-end="url(#arr-axis-4)"/>
    <text x="-80" y="5" class="fill-axis" font-size="15" font-style="italic">x</text>
    <text x="60" y="105" class="fill-axis" font-size="15" font-style="italic">y</text>
  </g>

  <!-- Dimensions (l x l) -->
  <line x1="140" y1="80" x2="140" y2="360" class="stroke-axis" stroke-width="1.8"/>
  <line x1="130" y1="80" x2="150" y2="80" class="stroke-axis" stroke-width="1.8"/>
  <line x1="130" y1="360" x2="150" y2="360" class="stroke-axis" stroke-width="1.8"/>
  <text x="120" y="225" text-anchor="end" class="fill-axis" font-size="16" font-style="italic">l</text>

  <line x1="180" y1="390" x2="460" y2="390" class="stroke-axis" stroke-width="1.8"/>
  <line x1="180" y1="380" x2="180" y2="400" class="stroke-axis" stroke-width="1.8"/>
  <line x1="460" y1="380" x2="460" y2="400" class="stroke-axis" stroke-width="1.8"/>
  <text x="320" y="415" text-anchor="middle" class="fill-axis" font-size="16" font-style="italic">l</text>

  <!-- Hydrostatic Water Pressure on Vertical Face AB -->
  <polygon points="460,80 600,360 460,360" class="plate-fill stroke-cyan" stroke-width="1.8"/>
  
  <g class="stroke-cyan" stroke-width="2" marker-end="url(#arr-cyan-4)">
    <line x1="480" y1="120" x2="463" y2="120"/>
    <line x1="505" y1="170" x2="463" y2="170"/>
    <line x1="530" y1="220" x2="463" y2="220"/>
    <line x1="555" y1="270" x2="463" y2="270"/>
    <line x1="580" y1="320" x2="463" y2="320"/>
    <line x1="598" y1="355" x2="463" y2="355"/>
  </g>
  <text x="615" y="240" class="fill-cyan" font-size="16" font-weight="600">p(y) = ρ<tspan font-size="11" dy="3">w</tspan> g y</text>

  <!-- Foundation Base Reaction Tractions along BC -->
  <!-- 1. Shear stress tx -->
  <g class="stroke-purple" stroke-width="2" marker-end="url(#arr-purple-4)">
    <line x1="220" y1="368" x2="265" y2="368"/>
    <line x1="290" y1="368" x2="335" y2="368"/>
    <line x1="360" y1="368" x2="405" y2="368"/>
    <line x1="430" y1="368" x2="455" y2="368"/>
  </g>
  <text x="475" y="372" class="fill-purple" font-size="14" font-weight="600">t<tspan font-size="10" dy="3">x</tspan></text>

  <!-- 2. Normal foundation tractions -->
  <line x1="180" y1="460" x2="460" y2="460" class="stroke-axis" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="180" y1="420" x2="460" y2="500" class="stroke-orange" stroke-width="2"/>
  
  <g class="stroke-orange" stroke-width="1.8" marker-end="url(#arr-orange-4)">
    <line x1="190" y1="460" x2="190" y2="423"/>
    <line x1="225" y1="460" x2="225" y2="433"/>
    <line x1="260" y1="460" x2="260" y2="443"/>
    <line x1="295" y1="460" x2="295" y2="453"/>
    
    <line x1="345" y1="460" x2="345" y2="467"/>
    <line x1="380" y1="460" x2="380" y2="477"/>
    <line x1="415" y1="460" x2="415" y2="487"/>
    <line x1="450" y1="460" x2="450" y2="497"/>
  </g>
  
  <text x="170" y="420" text-anchor="end" class="fill-orange" font-size="14" font-weight="600">+ρ g l</text>
  <text x="470" y="505" class="fill-orange" font-size="14" font-weight="600">−ρ g l</text>
  <text x="320" y="475" text-anchor="middle" class="fill-axis" font-size="12">t<tspan font-size="9" dy="2">y</tspan>(x)</text>
</svg>