<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="auto" class="tikz-svg" style="background: transparent; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    
  <style>
    .stroke-main { stroke: #0f172a; }
    .fill-main { fill: #0f172a; }
    .stroke-axis { stroke: #64748b; }
    .fill-axis { fill: #64748b; }
    .stroke-cyan { stroke: #0284c7; }
    .fill-cyan { fill: #0284c7; }
    .stroke-orange { stroke: #ea580c; }
    .fill-orange { fill: #ea580c; }
    .stroke-purple { stroke: #9333ea; }
    .fill-purple { fill: #9333ea; }
    .plate-fill { fill: #0284c7; fill-opacity: 0.06; }
    .dam-fill { stroke: #0284c7; stroke-opacity: 0.35; }

    :root[data-theme="dark"] .stroke-main,
    @media (prefers-color-scheme: dark) {
      .stroke-main { stroke: #f1f5f9; }
      .fill-main { fill: #f1f5f9; }
      .stroke-axis { stroke: #94a3b8; }
      .fill-axis { fill: #94a3b8; }
      .stroke-cyan { stroke: #00f0ff; }
      .fill-cyan { fill: #00f0ff; }
      .stroke-orange { stroke: #fb923c; }
      .fill-orange { fill: #fb923c; }
      .stroke-purple { stroke: #c084fc; }
      .fill-purple { fill: #c084fc; }
      .plate-fill { fill: #00f0ff; fill-opacity: 0.08; }
      .dam-fill { stroke: #00f0ff; stroke-opacity: 0.4; }
    }
    :root[data-theme="light"] .stroke-main { stroke: #0f172a; }
    :root[data-theme="light"] .fill-main { fill: #0f172a; }
    :root[data-theme="light"] .stroke-axis { stroke: #64748b; }
    :root[data-theme="light"] .fill-axis { fill: #64748b; }
    :root[data-theme="light"] .stroke-cyan { stroke: #0284c7; }
    :root[data-theme="light"] .fill-cyan { fill: #0284c7; }
    :root[data-theme="light"] .stroke-orange { stroke: #ea580c; }
    :root[data-theme="light"] .fill-orange { fill: #ea580c; }
    :root[data-theme="light"] .stroke-purple { stroke: #9333ea; }
    :root[data-theme="light"] .fill-purple { fill: #9333ea; }
    :root[data-theme="light"] .plate-fill { fill: #0284c7; fill-opacity: 0.06; }
    :root[data-theme="light"] .dam-fill { stroke: #0284c7; stroke-opacity: 0.35; }
  </style>

    <!-- Arrowhead markers -->
    <marker id="arr-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="fill-axis"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="fill-cyan"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="fill-orange"/>
    </marker>
  </defs>

  <!-- Coordinate system bottom-left -->
  <g transform="translate(60, 390)">
    <line x1="0" y1="0" x2="65" y2="0" class="stroke-axis" stroke-width="2" marker-end="url(#arr-axis)"/>
    <line x1="0" y1="0" x2="0" y2="-65" class="stroke-axis" stroke-width="2" marker-end="url(#arr-axis)"/>
    <text x="75" y="5" class="fill-axis" font-size="15" font-style="italic">x<tspan font-size="11" dy="4">1</tspan></text>
    <text x="-8" y="-75" class="fill-axis" font-size="15" font-style="italic">x<tspan font-size="11" dy="4">2</tspan></text>
  </g>

  <!-- Element Body (230, 140) to (490, 320) -> w=260, h=180 -->
  <rect x="230" y="140" width="260" height="180" rx="4" class="plate-fill stroke-cyan" stroke-width="2.5" />
  <text x="360" y="235" text-anchor="middle" class="fill-cyan" font-size="18" font-weight="bold" font-style="italic">dA</text>
  
  <!-- Dimension Labels -->
  <text x="360" y="305" text-anchor="middle" class="fill-axis" font-size="14" font-style="italic">Δx<tspan font-size="10" dy="3">1</tspan></text>
  <text x="250" y="235" text-anchor="middle" class="fill-axis" font-size="14" font-style="italic">Δx<tspan font-size="10" dy="3">2</tspan></text>

  <!-- Left Face: -e1 -->
  <!-- Normal stress sigma11 (pointing left) -->
  <line x1="230" y1="230" x2="120" y2="230" class="stroke-cyan" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
  <text x="110" y="225" text-anchor="end" class="fill-cyan" font-size="15" font-weight="650">σ<tspan font-size="11" dy="3">11</tspan></text>
  <!-- Shear stress sigma21 (pointing down) -->
  <line x1="215" y1="180" x2="215" y2="280" class="stroke-orange" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="205" y="240" text-anchor="end" class="fill-orange" font-size="14" font-weight="650">σ<tspan font-size="10" dy="3">21</tspan></text>
  <!-- Unit normal -n1 -->
  <line x1="230" y1="155" x2="175" y2="155" class="stroke-axis" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-axis)"/>
  <text x="165" y="150" text-anchor="end" class="fill-axis" font-size="13" font-style="italic">−n<tspan font-size="9" dy="2">1</tspan></text>

  <!-- Right Face: +e1 -->
  <!-- Normal stress sigma11 + Delta sigma11 (pointing right) -->
  <line x1="490" y1="230" x2="620" y2="230" class="stroke-cyan" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
  <text x="630" y="225" class="fill-cyan" font-size="15" font-weight="650">σ<tspan font-size="11" dy="3">11</tspan> + Δσ<tspan font-size="11" dy="0">11</tspan></text>
  <!-- Shear stress sigma21 + Delta sigma21 (pointing up) -->
  <line x1="505" y1="280" x2="505" y2="180" class="stroke-orange" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="515" y="240" class="fill-orange" font-size="14" font-weight="650">σ<tspan font-size="10" dy="3">21</tspan> + Δσ<tspan font-size="10" dy="0">21</tspan></text>
  <!-- Unit normal +n1 -->
  <line x1="490" y1="155" x2="545" y2="155" class="stroke-axis" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-axis)"/>
  <text x="555" y="150" class="fill-axis" font-size="13" font-style="italic">n<tspan font-size="9" dy="2">1</tspan></text>

  <!-- Bottom Face: -e2 -->
  <!-- Normal stress sigma22 (pointing down) -->
  <line x1="360" y1="320" x2="360" y2="420" class="stroke-cyan" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
  <text x="370" y="420" class="fill-cyan" font-size="15" font-weight="650">σ<tspan font-size="11" dy="3">22</tspan></text>
  <!-- Shear stress sigma12 (pointing left) -->
  <line x1="410" y1="335" x2="310" y2="335" class="stroke-orange" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="360" y="355" text-anchor="middle" class="fill-orange" font-size="14" font-weight="650">σ<tspan font-size="10" dy="3">12</tspan></text>
  <!-- Unit normal -n2 -->
  <line x1="260" y1="320" x2="260" y2="370" class="stroke-axis" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-axis)"/>
  <text x="270" y="375" class="fill-axis" font-size="13" font-style="italic">−n<tspan font-size="9" dy="2">2</tspan></text>

  <!-- Top Face: +e2 -->
  <!-- Normal stress sigma22 + Delta sigma22 (pointing up) -->
  <line x1="360" y1="140" x2="360" y2="40" class="stroke-cyan" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
  <text x="370" y="45" class="fill-cyan" font-size="15" font-weight="650">σ<tspan font-size="11" dy="3">22</tspan> + Δσ<tspan font-size="11" dy="0">22</tspan></text>
  <!-- Shear stress sigma12 + Delta sigma12 (pointing right) -->
  <line x1="310" y1="125" x2="410" y2="125" class="stroke-orange" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="360" y="115" text-anchor="middle" class="fill-orange" font-size="14" font-weight="650">σ<tspan font-size="10" dy="3">12</tspan> + Δσ<tspan font-size="10" dy="0">12</tspan></text>
  <!-- Unit normal +n2 -->
  <line x1="260" y1="140" x2="260" y2="90" class="stroke-axis" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-axis)"/>
  <text x="270" y="85" class="fill-axis" font-size="13" font-style="italic">n<tspan font-size="9" dy="2">2</tspan></text>
</svg>