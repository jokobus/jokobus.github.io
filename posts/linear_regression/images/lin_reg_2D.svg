<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-size="19" font-weight="700">2D Linear Regression &amp; Ordinary Least Squares</text>
  <text x="40" y="60" fill="#94a3b8" font-size="13">Minimizing the sum of squared vertical residuals: εᵢ = yᵢ - (axᵢ + b).</text>

  <!-- Legend -->
  <g transform="translate(520, 28)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="38" y="14" fill="#38bdf8" font-size="12" font-weight="600">Regression Line ŷ = ax + b</text>

    <line x1="205" y1="10" x2="235" y2="10" stroke="#ff007a" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="243" y="14" fill="#ff007a" font-size="12" font-weight="600">Residual εᵢ</text>
  </g>

  <!-- Plot Axes -->
  <!-- X Axis -->
  <line x1="100" y1="400" x2="740" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowMuted)"/>
  <text x="750" y="405" fill="#cbd5e1" font-size="13" font-weight="700">x</text>

  <!-- Y Axis -->
  <line x1="100" y1="400" x2="100" y2="80" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowMuted)"/>
  <text x="95" y="70" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">y</text>

  <!-- Subtle Horizontal Grid Lines -->
  <line x1="100" y1="322" x2="730" y2="322" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="245" x2="730" y2="245" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="167" x2="730" y2="167" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Ticks -->
  <text x="90" y="404" fill="#64748b" font-size="11" text-anchor="end">0</text>
  <text x="90" y="326" fill="#64748b" font-size="11" text-anchor="end">2</text>
  <text x="90" y="249" fill="#64748b" font-size="11" text-anchor="end">4</text>
  <text x="90" y="171" fill="#64748b" font-size="11" text-anchor="end">6</text>

  <!-- Regression Line -->
  <line x1="139.5" y1="351.9" x2="688.2" y2="142.9" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Residual Lines -->
  
    <line x1="169.0" y1="330.2" x2="169.0" y2="340.7" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="169.0" cy="340.7" r="3" fill="#ff007a"/>

    <line x1="228.0" y1="341.9" x2="228.0" y2="318.2" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="228.0" cy="318.2" r="3" fill="#ff007a"/>

    <line x1="287.0" y1="276.0" x2="287.0" y2="295.8" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="287.0" cy="295.8" r="3" fill="#ff007a"/>

    <line x1="346.0" y1="295.4" x2="346.0" y2="273.3" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="346.0" cy="273.3" r="3" fill="#ff007a"/>

    <line x1="405.0" y1="252.8" x2="405.0" y2="250.8" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="405.0" cy="250.8" r="3" fill="#ff007a"/>

    <line x1="452.2" y1="198.5" x2="452.2" y2="232.8" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="452.2" cy="232.8" r="3" fill="#ff007a"/>

    <line x1="493.5" y1="237.2" x2="493.5" y2="217.1" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="493.5" cy="217.1" r="3" fill="#ff007a"/>

    <line x1="552.5" y1="186.9" x2="552.5" y2="194.6" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="552.5" cy="194.6" r="3" fill="#ff007a"/>

    <line x1="593.8" y1="202.4" x2="593.8" y2="178.9" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="593.8" cy="178.9" r="3" fill="#ff007a"/>

    <line x1="641.0" y1="152.0" x2="641.0" y2="160.9" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"/>
    <circle cx="641.0" cy="160.9" r="3" fill="#ff007a"/>

  <!-- Data Points -->
  
    <g transform="translate(169.0, 330.2)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(228.0, 341.9)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(287.0, 276.0)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(346.0, 295.4)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(405.0, 252.8)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(452.2, 198.5)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(493.5, 237.2)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(552.5, 186.9)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(593.8, 202.4)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

    <g transform="translate(641.0, 152.0)">
      <circle r="7" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>

  <!-- Callout Annotation on one residual -->
  <g transform="translate(380, 150)">
    <rect width="180" height="42" rx="6" fill="#1e293b" stroke="#ff007a" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="90" y="18" fill="#ff007a" font-size="11" font-weight="700" text-anchor="middle">Vertical Residual:</text>
    <text x="90" y="33" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">εᵢ = yᵢ - (axᵢ + b)</text>
  </g>
  <line x1="380" y1="170" x2="350" y2="210" stroke="#ff007a" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Bottom Objective Formula -->
  <rect x="40" y="430" width="760" height="36" rx="6" fill="#111827" stroke="#1e293b"/>
  <text x="420" y="453" fill="#94a3b8" font-size="12" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">Optimization Goal (OLS):</tspan> Minimize Cost Function <tspan fill="#f8fafc" font-family="monospace">J(a, b) = ∑ᵢ εᵢ² = ∑ᵢ (yᵢ - axᵢ - b)²</tspan>
  </text>
</svg>