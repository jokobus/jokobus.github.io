<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-size="19" font-weight="700">Linear Regression Numerical Example</text>
  <text x="40" y="60" fill="#94a3b8" font-size="13">Fitted model y = 0.5x + 0.8 across the 5 sample points, highlighting the residual at x = 2.</text>

  <!-- Legend -->
  <g transform="translate(530, 28)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#38bdf8" stroke-width="3"/>
    <text x="38" y="14" fill="#38bdf8" font-size="12" font-weight="700">y = 0.5x + 0.8</text>

    <circle cx="160" cy="10" r="5" fill="#00f0ff"/>
    <text x="172" y="14" fill="#00f0ff" font-size="12" font-weight="600">Sample Point</text>
  </g>

  <!-- Grid lines -->
  <line x1="120" y1="304" x2="700" y2="304" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="218" x2="700" y2="218" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="133" x2="700" y2="133" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Vertical grid lines -->
  <line x1="248.9" y1="390" x2="248.9" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="377.8" y1="390" x2="377.8" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="506.7" y1="390" x2="506.7" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="635.6" y1="390" x2="635.6" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <line x1="120" y1="390" x2="720" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <text x="730" y="394" fill="#cbd5e1" font-size="13" font-weight="700">x</text>

  <line x1="120" y1="390" x2="120" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <text x="115" y="70" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">y</text>

  <!-- Ticks -->
  <text x="110" y="394" fill="#64748b" font-size="11" text-anchor="end">0</text>
  <text x="110" y="308" fill="#64748b" font-size="11" text-anchor="end">1.0</text>
  <text x="110" y="222" fill="#64748b" font-size="11" text-anchor="end">2.0</text>
  <text x="110" y="137" fill="#64748b" font-size="11" text-anchor="end">3.0</text>

  <text x="248.9" y="410" fill="#64748b" font-size="11" text-anchor="middle">1</text>
  <text x="377.8" y="410" fill="#64748b" font-size="11" text-anchor="middle">2</text>
  <text x="506.7" y="410" fill="#64748b" font-size="11" text-anchor="middle">3</text>
  <text x="635.6" y="410" fill="#64748b" font-size="11" text-anchor="middle">4</text>

  <!-- Fitted Regression Line -->
  <line x1="120.0" y1="321.4" x2="661.3" y2="141.4" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Y-Intercept Highlight at (0, 0.8) -->
  <circle cx="120.0" cy="321.4" r="5" fill="#f59e0b"/>
  <text x="130.0" y="325.4" fill="#f59e0b" font-size="11" font-weight="700">b = 0.8</text>

  <!-- Slope Triangle (between x=1 and x=3) -->
  <!-- At x=1: y = 1.3. At x=3: y = 2.3. Delta x = 2, Delta y = 1 -> slope = 0.5 -->
  <path d="M 248.9 278.6 L 506.7 278.6 L 506.7 192.9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="377.8" y="294.6" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Δx = 2</text>
  <text x="514.7" y="239.75" fill="#f59e0b" font-size="10" font-weight="600">Δy = 1 &#x27F9; a = 0.5</text>

  <!-- Residuals -->
  
    <line x1="120.0" y1="304.3" x2="120.0" y2="321.4" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="120.0" cy="321.4" r="3" fill="#ff007a"/>

    <line x1="248.9" y1="304.3" x2="248.9" y2="278.6" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="248.9" cy="278.6" r="3" fill="#ff007a"/>

    <line x1="377.8" y1="218.6" x2="377.8" y2="235.7" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="377.8" cy="235.7" r="3" fill="#ff007a"/>

    <line x1="506.7" y1="218.6" x2="506.7" y2="192.9" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="506.7" cy="192.9" r="3" fill="#ff007a"/>

    <line x1="635.6" y1="132.9" x2="635.6" y2="150.0" stroke="#ff007a" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="635.6" cy="150.0" r="3" fill="#ff007a"/>

  <!-- Points -->
  
    <g transform="translate(120.0, 304.3)">
      <circle r="8" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="4" fill="#ffffff"/>
      <text x="0" y="-14" fill="#00f0ff" font-size="11" font-weight="700" text-anchor="middle">(0, 1)</text>
    </g>

    <g transform="translate(248.9, 304.3)">
      <circle r="8" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="4" fill="#ffffff"/>
      <text x="0" y="-14" fill="#00f0ff" font-size="11" font-weight="700" text-anchor="middle">(1, 1)</text>
    </g>

    <g transform="translate(377.8, 218.6)">
      <circle r="8" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="4" fill="#ffffff"/>
      <text x="0" y="-14" fill="#00f0ff" font-size="11" font-weight="700" text-anchor="middle">(2, 2)</text>
    </g>

    <g transform="translate(506.7, 218.6)">
      <circle r="8" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="4" fill="#ffffff"/>
      <text x="0" y="-14" fill="#00f0ff" font-size="11" font-weight="700" text-anchor="middle">(3, 2)</text>
    </g>

    <g transform="translate(635.6, 132.9)">
      <circle r="8" fill="#00f0ff" filter="url(#cyanGlow)"/>
      <circle r="4" fill="#ffffff"/>
      <text x="0" y="-14" fill="#00f0ff" font-size="11" font-weight="700" text-anchor="middle">(4, 3)</text>
    </g>

  <!-- Point at x=2 prediction callout -->
  <g transform="translate(410, 150)">
    <rect width="190" height="52" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="95" y="20" fill="#00f0ff" font-size="12" font-weight="700" text-anchor="middle">Prediction at x = 2:</text>
    <text x="95" y="38" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">ŷ = 0.5(2) + 0.8 = 1.8 ≠ 2</text>
  </g>
  <line x1="410" y1="176" x2="387.8" y2="227.14999999999998" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Bottom Formulas Summary -->
  <rect x="40" y="430" width="760" height="36" rx="6" fill="#111827" stroke="#1e293b"/>
  <text x="420" y="453" fill="#94a3b8" font-size="12" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">Calculated Parameters:</tspan> Slope <tspan fill="#f8fafc" font-family="monospace">a = 25/50 = 0.5</tspan> | Intercept <tspan fill="#f8fafc" font-family="monospace">b = (9 - 5)/5 = 0.8</tspan> &#x27F9; <tspan fill="#10b981" font-weight="700">y = 0.5x + 0.8</tspan>
  </text>
</svg>