<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-size="19" font-weight="700">Linearization of Non-Linear Relationships</text>
  <text x="40" y="60" fill="#94a3b8" font-size="13">Mathematical transformations converting non-linear response curves into linear forms suitable for OLS.</text>

  
    <!-- Panel 1: Exponential Model -->
    <g transform="translate(40, 90)">
      <rect width="380" height="270" rx="10" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Axes -->
      <line x1="50" y1="137.5" x2="350" y2="137.5" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="205.0" y1="40" x2="205.0" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Axis Labels -->
      <text x="355" y="151.5" fill="#64748b" font-size="10">x</text>
      <text x="195.0" y="48" fill="#64748b" font-size="10">y</text>

      <!-- Curve -->
      
      <path d="M 60.0,203.8 L 63.5,203.7 L 67.0,203.7 L 70.5,203.6 L 74.0,203.6 L 77.5,203.5 L 81.0,203.4 L 84.5,203.3 L 88.0,203.2 L 91.5,203.1 L 95.0,203.0 L 98.5,202.9 L 102.0,202.8 L 105.5,202.7 L 109.0,202.5 L 112.5,202.4 L 116.0,202.2 L 119.5,202.1 L 123.0,201.9 L 126.5,201.7 L 130.0,201.5 L 133.5,201.3 L 137.0,201.0 L 140.5,200.8 L 144.0,200.5 L 147.5,200.2 L 151.0,199.9 L 154.5,199.6 L 158.0,199.2 L 161.5,198.8 L 165.0,198.4 L 168.5,198.0 L 172.0,197.5 L 175.5,197.0 L 179.0,196.4 L 182.5,195.8 L 186.0,195.2 L 189.5,194.5 L 193.0,193.8 L 196.5,193.0 L 200.0,192.2 L 203.5,191.3 L 207.0,190.3 L 210.5,189.3 L 214.0,188.2 L 217.5,187.0 L 221.0,185.7 L 224.5,184.4 L 228.0,182.9 L 231.5,181.3 L 235.0,179.6 L 238.5,177.8 L 242.0,175.9 L 245.5,173.8 L 249.0,171.6 L 252.5,169.2 L 256.0,166.7 L 259.5,163.9 L 263.0,161.0 L 266.5,157.8 L 270.0,154.4 L 273.5,150.8 L 277.0,146.9 L 280.5,142.7 L 284.0,138.2 L 287.5,133.4 L 291.0,128.2 L 294.5,122.7 L 298.0,116.8 L 301.5,110.4 L 305.0,103.6 L 308.5,96.3 L 312.0,88.4 L 315.5,80.0 L 319.0,71.0 L 322.5,61.3" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Title Bar -->
      <rect x="0" y="0" width="380" height="32" rx="10" fill="#1e293b" fill-opacity="0.6"/>
      <text x="14" y="21" fill="#f8fafc" font-size="13" font-weight="700">Exponential Model</text>

      <!-- Model Formulas Footer -->
      <rect x="10" y="236" width="360" height="26" rx="6" fill="#111827"/>
      <text x="190.0" y="253" fill="#94a3b8" font-size="11" text-anchor="middle">
        <tspan fill="#f8fafc" font-weight="600">y = a · eᵇˣ</tspan> &#x27F9; <tspan fill="#00f0ff" font-weight="700">ln(y) = bx + ln(a)</tspan>
      </text>
    </g>
  
    <!-- Panel 2: Power Model -->
    <g transform="translate(460, 90)">
      <rect width="380" height="270" rx="10" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Axes -->
      <line x1="50" y1="137.5" x2="350" y2="137.5" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="205.0" y1="40" x2="205.0" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Axis Labels -->
      <text x="355" y="151.5" fill="#64748b" font-size="10">x</text>
      <text x="195.0" y="48" fill="#64748b" font-size="10">y</text>

      <!-- Curve -->
      
      <path d="M 67.0,70.6 L 70.5,77.6 L 74.0,84.4 L 77.5,91.0 L 81.0,97.4 L 84.5,103.6 L 88.0,109.6 L 91.5,115.4 L 95.0,121.1 L 98.5,126.6 L 102.0,131.8 L 105.5,136.9 L 109.0,141.9 L 112.5,146.6 L 116.0,151.1 L 119.5,155.5 L 123.0,159.7 L 126.5,163.7 L 130.0,167.5 L 133.5,171.1 L 137.0,174.5 L 140.5,177.7 L 144.0,180.8 L 147.5,183.7 L 151.0,186.4 L 154.5,188.9 L 158.0,191.2 L 161.5,193.3 L 165.0,195.3 L 168.5,197.0 L 172.0,198.6 L 175.5,200.0 L 179.0,201.2 L 182.5,202.2 L 186.0,203.1 L 189.5,203.7 L 193.0,204.2 L 196.5,204.5 L 200.0,204.5 L 203.5,204.5 L 207.0,204.2 L 210.5,203.7 L 214.0,203.1 L 217.5,202.2 L 221.0,201.2 L 224.5,200.0 L 228.0,198.6 L 231.5,197.0 L 235.0,195.3 L 238.5,193.3 L 242.0,191.2 L 245.5,188.9 L 249.0,186.4 L 252.5,183.7 L 256.0,180.8 L 259.5,177.7 L 263.0,174.5 L 266.5,171.1 L 270.0,167.5 L 273.5,163.7 L 277.0,159.7 L 280.5,155.5 L 284.0,151.1 L 287.5,146.6 L 291.0,141.9 L 294.5,136.9 L 298.0,131.8 L 301.5,126.6 L 305.0,121.1 L 308.5,115.4 L 312.0,109.6 L 315.5,103.6 L 319.0,97.4 L 322.5,91.0 L 326.0,84.4 L 329.5,77.6 L 333.0,70.6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Title Bar -->
      <rect x="0" y="0" width="380" height="32" rx="10" fill="#1e293b" fill-opacity="0.6"/>
      <text x="14" y="21" fill="#f8fafc" font-size="13" font-weight="700">Power Model</text>

      <!-- Model Formulas Footer -->
      <rect x="10" y="236" width="360" height="26" rx="6" fill="#111827"/>
      <text x="190.0" y="253" fill="#94a3b8" font-size="11" text-anchor="middle">
        <tspan fill="#f8fafc" font-weight="600">y = a · xᵇ</tspan> &#x27F9; <tspan fill="#38bdf8" font-weight="700">ln(y) = b·ln(x) + ln(a)</tspan>
      </text>
    </g>
  
    <!-- Panel 3: Saturation Model -->
    <g transform="translate(40, 395)">
      <rect width="380" height="270" rx="10" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Axes -->
      <line x1="50" y1="137.5" x2="350" y2="137.5" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="205.0" y1="40" x2="205.0" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Axis Labels -->
      <text x="355" y="151.5" fill="#64748b" font-size="10">x</text>
      <text x="195.0" y="48" fill="#64748b" font-size="10">y</text>

      <!-- Curve -->
      <line x1="60" y1="80.9" x2="340" y2="80.9" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3"/>
      <path d="M 67.0,220.0 L 70.5,220.0 L 74.0,220.0 L 77.5,220.0 L 81.0,220.0 L 84.5,220.0 L 88.0,220.0 L 91.5,220.0 L 95.0,220.0 L 98.5,220.0 L 102.0,220.0 L 105.5,220.0 L 109.0,220.0 L 112.5,220.0 L 116.0,220.0 L 119.5,220.0 L 123.0,220.0 L 126.5,220.0 L 130.0,220.0 L 133.5,220.0 L 137.0,220.0 L 140.5,220.0 L 144.0,220.0 L 147.5,220.0 L 151.0,220.0 L 154.5,220.0 L 158.0,220.0 L 161.5,220.0 L 165.0,220.0 L 168.5,220.0 L 172.0,220.0 L 175.5,220.0 L 179.0,220.0 L 182.5,220.0 L 186.0,220.0 L 189.5,220.0 L 193.0,220.0 L 196.5,212.7 L 200.0,204.5 L 203.5,196.8 L 207.0,190.0 L 210.5,183.9 L 214.0,178.5 L 217.5,173.6 L 221.0,169.2 L 224.5,165.2 L 228.0,161.5 L 231.5,158.2 L 235.0,155.1 L 238.5,152.2 L 242.0,149.6 L 245.5,147.1 L 249.0,144.9 L 252.5,142.7 L 256.0,140.7 L 259.5,138.9 L 263.0,137.1 L 266.5,135.5 L 270.0,133.9 L 273.5,132.4 L 277.0,131.0 L 280.5,129.7 L 284.0,128.5 L 287.5,127.3 L 291.0,126.1 L 294.5,125.1 L 298.0,124.0 L 301.5,123.1 L 305.0,122.1 L 308.5,121.2 L 312.0,120.4 L 315.5,119.5 L 319.0,118.8 L 322.5,118.0 L 326.0,117.3 L 329.5,116.6 L 333.0,115.9" fill="none" stroke="#ff007a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Title Bar -->
      <rect x="0" y="0" width="380" height="32" rx="10" fill="#1e293b" fill-opacity="0.6"/>
      <text x="14" y="21" fill="#f8fafc" font-size="13" font-weight="700">Saturation Model</text>

      <!-- Model Formulas Footer -->
      <rect x="10" y="236" width="360" height="26" rx="6" fill="#111827"/>
      <text x="190.0" y="253" fill="#94a3b8" font-size="11" text-anchor="middle">
        <tspan fill="#f8fafc" font-weight="600">y = ax / (b + x)</tspan> &#x27F9; <tspan fill="#ff007a" font-weight="700">1/y = (b/a)(1/x) + 1/a</tspan>
      </text>
    </g>
  
    <!-- Panel 4: Polynomial Model -->
    <g transform="translate(460, 395)">
      <rect width="380" height="270" rx="10" fill="#0d1322" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Axes -->
      <line x1="50" y1="137.5" x2="350" y2="137.5" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="205.0" y1="40" x2="205.0" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Axis Labels -->
      <text x="355" y="151.5" fill="#64748b" font-size="10">x</text>
      <text x="195.0" y="48" fill="#64748b" font-size="10">y</text>

      <!-- Curve -->
      
      <path d="M 67.0,220.0 L 70.5,220.0 L 74.0,220.0 L 77.5,220.0 L 81.0,212.8 L 84.5,205.6 L 88.0,198.9 L 91.5,192.6 L 95.0,186.8 L 98.5,181.3 L 102.0,176.3 L 105.5,171.7 L 109.0,167.4 L 112.5,163.5 L 116.0,159.9 L 119.5,156.7 L 123.0,153.8 L 126.5,151.2 L 130.0,148.9 L 133.5,146.9 L 137.0,145.1 L 140.5,143.6 L 144.0,142.3 L 147.5,141.3 L 151.0,140.4 L 154.5,139.8 L 158.0,139.3 L 161.5,139.0 L 165.0,138.9 L 168.5,138.9 L 172.0,139.0 L 175.5,139.2 L 179.0,139.5 L 182.5,139.9 L 186.0,140.4 L 189.5,140.9 L 193.0,141.5 L 196.5,142.1 L 200.0,142.7 L 203.5,143.3 L 207.0,143.9 L 210.5,144.5 L 214.0,145.1 L 217.5,145.5 L 221.0,145.9 L 224.5,146.3 L 228.0,146.5 L 231.5,146.6 L 235.0,146.6 L 238.5,146.4 L 242.0,146.1 L 245.5,145.7 L 249.0,145.0 L 252.5,144.2 L 256.0,143.1 L 259.5,141.8 L 263.0,140.3 L 266.5,138.6 L 270.0,136.5 L 273.5,134.2 L 277.0,131.6 L 280.5,128.7 L 284.0,125.5 L 287.5,122.0 L 291.0,118.1 L 294.5,113.8 L 298.0,109.1 L 301.5,104.1 L 305.0,98.7 L 308.5,92.8 L 312.0,86.5 L 315.5,79.8 L 319.0,72.6 L 322.5,65.0 L 326.0,56.8 L 329.5,50.0 L 333.0,50.0" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Title Bar -->
      <rect x="0" y="0" width="380" height="32" rx="10" fill="#1e293b" fill-opacity="0.6"/>
      <text x="14" y="21" fill="#f8fafc" font-size="13" font-weight="700">Polynomial Model</text>

      <!-- Model Formulas Footer -->
      <rect x="10" y="236" width="360" height="26" rx="6" fill="#111827"/>
      <text x="190.0" y="253" fill="#94a3b8" font-size="11" text-anchor="middle">
        <tspan fill="#f8fafc" font-weight="600">y = a₂x² + a₁x + a₀</tspan> &#x27F9; <tspan fill="#a855f7" font-weight="700">Multivariate Normal Equations</tspan>
      </text>
    </g>
</svg>