<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-size="19" font-weight="700">3-Layer Feedforward Evaluation Walkthrough</text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">Evaluation of the 3-layer network with inputs [1, 2, 3] and binary step activation.</text>

  <!-- Headers -->
  <text x="140" y="92" fill="#00f0ff" font-size="13" font-weight="700" text-anchor="middle">Input: x</text>
  <text x="440" y="92" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">Hidden: z</text>
  <text x="760" y="92" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">Prediction: y</text>

  <!-- Connections: x -> z -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" marker-end="url(#arrowBlue)">
    <line x1="164" y1="130" x2="400" y2="200"/>
    <line x1="164" y1="130" x2="400" y2="280"/>
    <line x1="164" y1="130" x2="400" y2="360"/>

    <line x1="164" y1="230" x2="400" y2="200"/>
    <line x1="164" y1="230" x2="400" y2="280"/>
    <line x1="164" y1="230" x2="400" y2="360"/>

    <line x1="164" y1="330" x2="400" y2="200"/>
    <line x1="164" y1="330" x2="400" y2="280"/>
    <line x1="164" y1="330" x2="400" y2="360"/>
  </g>

  <!-- Weight Numbers W -->
  <g fill="#38bdf8" font-size="11" font-weight="700">
    <!-- from x0 (bias): w01=1, w02=0, w03=4 -->
    <text x="250" y="145">1</text>
    <text x="240" y="165">0</text>
    <text x="230" y="185">4</text>
    <!-- from x1: w11=2, w12=3, w13=-4 -->
    <text x="260" y="210">2</text>
    <text x="280" y="245">3</text>
    <text x="260" y="275">-4</text>
    <!-- from x2: w21=-0.5, w22=-2, w23=1 -->
    <text x="230" y="300">-0.5</text>
    <text x="240" y="325">-2</text>
    <text x="250" y="350">1</text>
  </g>

  <!-- Connections: z -> y -->
  <g stroke="#ff007a" stroke-width="1.2" stroke-opacity="0.35" marker-end="url(#arrowPink)">
    <line x1="474" y1="130" x2="724" y2="220"/>
    <line x1="474" y1="130" x2="724" y2="340"/>

    <line x1="474" y1="200" x2="724" y2="220"/>
    <line x1="474" y1="200" x2="724" y2="340"/>

    <line x1="474" y1="280" x2="724" y2="220"/>
    <line x1="474" y1="280" x2="724" y2="340"/>

    <line x1="474" y1="360" x2="724" y2="220"/>
    <line x1="474" y1="360" x2="724" y2="340"/>
  </g>

  <!-- Weight Numbers V -->
  <g fill="#ff007a" font-size="11" font-weight="700">
    <text x="560" y="150">0.25</text>
    <text x="545" y="170">-1</text>

    <text x="575" y="205">2</text>
    <text x="585" y="235">0.5</text>

    <text x="585" y="270">1.5</text>
    <text x="575" y="300">1</text>

    <text x="545" y="335">0.75</text>
    <text x="560" y="365">1.25</text>
  </g>

  <!-- Layer 1 Nodes (Inputs) -->
  <g transform="translate(140, 130)">
    <circle r="24" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="6" fill="#f59e0b" font-size="14" font-weight="800" text-anchor="middle">1</text>
    <text x="-32" y="6" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="end">x<tspan font-size="9" dy="2">0</tspan>=1</text>
  </g>
  <g transform="translate(140, 230)">
    <circle r="24" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="0" y="6" fill="#00f0ff" font-size="14" font-weight="800" text-anchor="middle">2</text>
    <text x="-32" y="6" fill="#00f0ff" font-size="11" font-weight="600" text-anchor="end">x<tspan font-size="9" dy="2">1</tspan>=2</text>
  </g>
  <g transform="translate(140, 330)">
    <circle r="24" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="0" y="6" fill="#00f0ff" font-size="14" font-weight="800" text-anchor="middle">3</text>
    <text x="-32" y="6" fill="#00f0ff" font-size="11" font-weight="600" text-anchor="end">x<tspan font-size="9" dy="2">2</tspan>=3</text>
  </g>

  <!-- Layer 2 Nodes (Hidden with in/out calculations) -->
  <!-- z0 Bias -->
  <g transform="translate(440, 130)">
    <circle r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" fill="#f59e0b" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <text x="30" y="5" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="start">z<tspan font-size="9" dy="2">0</tspan>=1</text>
  </g>
  <!-- z1: zin=3.5 -> zout=1 -->
  <g transform="translate(440, 200)">
    <circle r="22" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#a855f7" font-size="14" font-weight="800" text-anchor="middle">1</text>
    <rect x="-85" y="-12" width="56" height="24" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="-57" y="4" fill="#a855f7" font-size="11" font-weight="700" text-anchor="middle">3.5 &#x27F9; 1</text>
  </g>
  <!-- z2: zin=0 -> zout=0 -->
  <g transform="translate(440, 280)">
    <circle r="22" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#a855f7" font-size="14" font-weight="800" text-anchor="middle">0</text>
    <rect x="-75" y="-12" width="46" height="24" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="-52" y="4" fill="#a855f7" font-size="11" font-weight="700" text-anchor="middle">0 &#x27F9; 0</text>
  </g>
  <!-- z3: zin=-1 -> zout=0 -->
  <g transform="translate(440, 360)">
    <circle r="22" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#a855f7" font-size="14" font-weight="800" text-anchor="middle">0</text>
    <rect x="-80" y="-12" width="52" height="24" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="-54" y="4" fill="#a855f7" font-size="11" font-weight="700" text-anchor="middle">-1 &#x27F9; 0</text>
  </g>

  <!-- Layer 3 Nodes (Output) -->
  <!-- y1: yin=2.25 -> yout=1 -->
  <g transform="translate(760, 220)">
    <circle r="26" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="0" y="7" fill="#10b981" font-size="18" font-weight="800" text-anchor="middle">1</text>
    <rect x="36" y="-12" width="80" height="24" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="76" y="4" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">2.25 &#x27F9; 1</text>
  </g>
  <!-- y2: yin=-0.5 -> yout=0 -->
  <g transform="translate(760, 340)">
    <circle r="26" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="0" y="7" fill="#10b981" font-size="18" font-weight="800" text-anchor="middle">0</text>
    <rect x="36" y="-12" width="80" height="24" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="76" y="4" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">-0.5 &#x27F9; 0</text>
  </g>

  <!-- Summary Card -->
  <rect x="40" y="425" width="840" height="70" rx="10" fill="#111827" stroke="#1e293b"/>
  <text x="60" y="450" fill="#f8fafc" font-size="13" font-weight="700">Evaluation Summary:</text>
  <text x="60" y="475" fill="#94a3b8" font-size="12">
    Hidden Layer: z<tspan font-size="9" dy="2">1,in</tspan><tspan dy="-2">=3.5 &#x27F9; z</tspan><tspan font-size="9" dy="2">1</tspan><tspan dy="-2">=1</tspan> | 
    z<tspan font-size="9" dy="2">2,in</tspan><tspan dy="-2">=0 &#x27F9; z</tspan><tspan font-size="9" dy="2">2</tspan><tspan dy="-2">=0</tspan> | 
    z<tspan font-size="9" dy="2">3,in</tspan><tspan dy="-2">=-1 &#x27F9; z</tspan><tspan font-size="9" dy="2">3</tspan><tspan dy="-2">=0</tspan>
  </text>
  <text x="560" y="475" fill="#10b981" font-size="13" font-weight="800">
    Output Prediction: y<tspan font-size="10" dy="2">1</tspan><tspan dy="-2">=1, y</tspan><tspan font-size="10" dy="2">2</tspan><tspan dy="-2">=0</tspan>
  </text>
</svg>