<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  
  <!-- Subtle Grid Background -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Diagram Title / Header -->
  <text x="40" y="42" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.5">Architecture of an Artificial Neuron (Perceptron)</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13">Inputs are scaled by synaptic weights, summed, and transformed by an activation function.</text>

  <!-- Section Annotations -->
  <text x="95" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">INPUTS</text>
  <text x="245" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">WEIGHTS</text>
  <text x="480" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">SUMMATION &amp; ACTIVATION</text>
  <text x="740" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">OUTPUT</text>

  <!-- Input Nodes -->
  <!-- x1 -->
  <g transform="translate(95, 150)">
    <circle r="26" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="0" y="6" fill="#00f0ff" font-size="16" font-weight="700" text-anchor="middle">x<tspan font-size="12" dy="4">1</tspan></text>
  </g>

  <!-- x2 -->
  <g transform="translate(95, 240)">
    <circle r="26" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="0" y="6" fill="#00f0ff" font-size="16" font-weight="700" text-anchor="middle">x<tspan font-size="12" dy="4">2</tspan></text>
  </g>

  <!-- x0 (Bias) -->
  <g transform="translate(95, 330)">
    <circle r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="6" fill="#f59e0b" font-size="16" font-weight="700" text-anchor="middle">x<tspan font-size="12" dy="4">0</tspan></text>
    <rect x="-38" y="32" width="76" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="46" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">Bias (=1)</text>
  </g>

  <!-- Connection Lines & Weight Badges -->
  <!-- x1 -> Node -->
  <line x1="121" y1="150" x2="395" y2="230" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrowCyan)" stroke-opacity="0.8"/>
  <rect x="225" y="165" width="56" height="26" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="253" y="183" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">w<tspan font-size="10" dy="3">1</tspan></text>

  <!-- x2 -> Node -->
  <line x1="121" y1="240" x2="395" y2="240" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrowCyan)" stroke-opacity="0.8"/>
  <rect x="225" y="227" width="56" height="26" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="253" y="245" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">w<tspan font-size="10" dy="3">2</tspan></text>

  <!-- x0 -> Node -->
  <line x1="121" y1="330" x2="395" y2="250" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)" stroke-opacity="0.8"/>
  <rect x="225" y="290" width="56" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="253" y="308" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">w<tspan font-size="10" dy="3">0</tspan></text>

  <!-- Central Processing Unit (Neuron) -->
  <!-- Outer Capsule Container -->
  <rect x="400" y="160" width="160" height="160" rx="80" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#softShadow)"/>
  
  <!-- Divider -->
  <line x1="480" y1="165" x2="480" y2="315" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Left Half: Summation Sigma -->
  <text x="445" y="235" fill="#38bdf8" font-size="34" font-weight="700" text-anchor="middle">∑</text>
  <text x="445" y="265" fill="#94a3b8" font-size="11" text-anchor="middle">w<tspan font-size="9" dy="2">i</tspan><tspan dy="-2">·x</tspan><tspan font-size="9" dy="2">i</tspan></text>
  <text x="445" y="285" fill="#00f0ff" font-size="12" font-weight="600" text-anchor="middle">y<tspan font-size="9" dy="2">in</tspan></text>

  <!-- Right Half: Activation f(y_in) -->
  <text x="515" y="235" fill="#ff007a" font-size="24" font-weight="700" text-anchor="middle">f(·)</text>
  <text x="515" y="265" fill="#94a3b8" font-size="11" text-anchor="middle">activation</text>
  <text x="515" y="285" fill="#ff007a" font-size="12" font-weight="600" text-anchor="middle">y<tspan font-size="9" dy="2">out</tspan></text>

  <!-- Small Activation S-curve icon inside right half -->
  <path d="M 500 205 Q 515 205 515 195 Q 515 185 530 185" fill="none" stroke="#ff007a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Output Arrow & Node -->
  <line x1="560" y1="240" x2="695" y2="240" stroke="#00f0ff" stroke-width="3" marker-end="url(#arrowCyan)"/>
  
  <g transform="translate(740, 240)">
    <circle r="30" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="0" y="7" fill="#10b981" font-size="18" font-weight="700" text-anchor="middle">y</text>
    <rect x="-44" y="38" width="88" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="53" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Output</text>
  </g>

  <!-- Step Labels at Bottom -->
  <g transform="translate(60, 395)">
    <text x="0" y="0" fill="#94a3b8" font-size="12">
      <tspan fill="#38bdf8" font-weight="700">1.</tspan> y<tspan font-size="9" dy="2">in</tspan><tspan dy="-2"> = w</tspan><tspan font-size="9" dy="2">1</tspan><tspan dy="-2">x</tspan><tspan font-size="9" dy="2">1</tspan><tspan dy="-2"> + w</tspan><tspan font-size="9" dy="2">2</tspan><tspan dy="-2">x</tspan><tspan font-size="9" dy="2">2</tspan><tspan dy="-2"> + w</tspan><tspan font-size="9" dy="2">0</tspan><tspan dy="-2">x</tspan><tspan font-size="9" dy="2">0</tspan>
      <tspan dx="40" fill="#ff007a" font-weight="700">2.</tspan> y<tspan font-size="9" dy="2">out</tspan><tspan dy="-2"> = f(y</tspan><tspan font-size="9" dy="2">in</tspan><tspan dy="-2">)</tspan>
      <tspan dx="40" fill="#10b981" font-weight="700">3.</tspan> Transmit y<tspan font-size="9" dy="2">out</tspan><tspan dy="-2"> to subsequent layer</tspan>
    </text>
  </g>
</svg>