<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Subtle Grid Background -->
  <pattern id="grid_ex" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid_ex)" rx="12" />

  <!-- Diagram Title / Header -->
  <text x="40" y="42" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.5">Numerical Example: Single Neuron Evaluation</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13">Calculation using specific inputs [2, 4, 1], weights [1, 2, 3], and a binary step function.</text>

  <!-- Section Annotations -->
  <text x="95" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">INPUT VALUES</text>
  <text x="245" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">WEIGHT VALUES</text>
  <text x="480" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">EVALUATION</text>
  <text x="740" y="105" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">FINAL OUTPUT</text>

  <!-- Input Nodes with values -->
  <!-- x1 = 2 -->
  <g transform="translate(95, 150)">
    <circle r="26" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="0" y="6" fill="#00f0ff" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="0" y="-32" fill="#64748b" font-size="11" text-anchor="middle">x<tspan font-size="9" dy="2">1</tspan> = 2</text>
  </g>

  <!-- x2 = 4 -->
  <g transform="translate(95, 240)">
    <circle r="26" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="0" y="6" fill="#00f0ff" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="0" y="-32" fill="#64748b" font-size="11" text-anchor="middle">x<tspan font-size="9" dy="2">2</tspan> = 4</text>
  </g>

  <!-- x0 = 1 (Bias) -->
  <g transform="translate(95, 330)">
    <circle r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="6" fill="#f59e0b" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <rect x="-38" y="32" width="76" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="46" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">Bias x<tspan font-size="9" dy="2">0</tspan>=1</text>
  </g>

  <!-- Connection Lines & Numerical Weights -->
  <!-- x1 -> Node (w1 = 1) -->
  <line x1="121" y1="150" x2="395" y2="230" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrowCyan)" stroke-opacity="0.8"/>
  <rect x="220" y="165" width="66" height="26" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="253" y="183" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">w<tspan font-size="10" dy="2">1</tspan><tspan dy="-2"> = 1</tspan></text>

  <!-- x2 -> Node (w2 = 2) -->
  <line x1="121" y1="240" x2="395" y2="240" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrowCyan)" stroke-opacity="0.8"/>
  <rect x="220" y="227" width="66" height="26" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="253" y="245" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">w<tspan font-size="10" dy="2">2</tspan><tspan dy="-2"> = 2</tspan></text>

  <!-- x0 -> Node (w0 = 3) -->
  <line x1="121" y1="330" x2="395" y2="250" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)" stroke-opacity="0.8"/>
  <rect x="220" y="290" width="66" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="253" y="308" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">w<tspan font-size="10" dy="2">0</tspan><tspan dy="-2"> = 3</tspan></text>

  <!-- Central Processing Unit (Neuron) -->
  <rect x="390" y="155" width="180" height="170" rx="20" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#softShadow)"/>

  <!-- Inside the Node -->
  <text x="480" y="185" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">1·2 + 2·4 + 3·1</text>
  <line x1="410" y1="200" x2="550" y2="200" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="224" fill="#00f0ff" font-size="20" font-weight="800" text-anchor="middle">y<tspan font-size="13" dy="3">in</tspan><tspan dy="-3"> = 13</tspan></text>

  <rect x="410" y="245" width="140" height="60" rx="10" fill="#111827" stroke="#ff007a" stroke-width="1.5"/>
  <text x="480" y="268" fill="#94a3b8" font-size="11" text-anchor="middle">Binary Step f(x > 0)</text>
  <text x="480" y="293" fill="#ff007a" font-size="16" font-weight="800" text-anchor="middle">f(13) = 1</text>

  <!-- Output Arrow & Result -->
  <line x1="570" y1="240" x2="695" y2="240" stroke="#10b981" stroke-width="3" marker-end="url(#arrowCyan)"/>

  <g transform="translate(740, 240)">
    <circle r="32" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#softShadow)"/>
    <text x="0" y="8" fill="#10b981" font-size="24" font-weight="800" text-anchor="middle">1</text>
    <rect x="-48" y="42" width="96" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="57" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">y<tspan font-size="9" dy="2">out</tspan><tspan dy="-2"> = 1</tspan></text>
  </g>

  <!-- Step Breakdown Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="0" fill="#94a3b8" font-size="12">
      <tspan fill="#00f0ff" font-weight="700">Calculation:</tspan> y<tspan font-size="9" dy="2">in</tspan><tspan dy="-2"> = (1·2) + (2·4) + (3·1) = 2 + 8 + 3 = </tspan><tspan fill="#00f0ff" font-weight="700">13</tspan>
      <tspan dx="25" fill="#ff007a" font-weight="700">Threshold:</tspan> 13 &gt; 0 &#x27F9; y<tspan font-size="9" dy="2">out</tspan><tspan dy="-2"> = </tspan><tspan fill="#10b981" font-weight="800">1</tspan>
    </text>
  </g>
</svg>