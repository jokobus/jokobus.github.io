<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Header -->
  <text x="40" y="40" fill="#f8fafc" font-size="19" font-weight="700">Vectorized Feedforward via Matrix Calculus</text>
  <text x="40" y="62" fill="#94a3b8" font-size="13">High-throughput layer transformations computed via affine matrix multiplications: z = Wᵀx and y = Vᵀz.</text>

  <!-- Vector x -->
  <g transform="translate(70, 110)">
    <rect width="90" height="150" rx="8" fill="#111827" stroke="#00f0ff" stroke-width="1.8" filter="url(#cyanGlow)"/>
    <text x="45" y="28" fill="#00f0ff" font-size="14" font-weight="700" text-anchor="middle">Input x</text>
    <text x="45" y="70" fill="#f8fafc" font-size="13" text-anchor="middle">x<tspan font-size="10" dy="2">0</tspan><tspan dy="-2"> (bias)</tspan></text>
    <text x="45" y="100" fill="#f8fafc" font-size="13" text-anchor="middle">x<tspan font-size="10" dy="2">1</tspan></text>
    <text x="45" y="130" fill="#f8fafc" font-size="13" text-anchor="middle">x<tspan font-size="10" dy="2">2</tspan></text>
    <text x="45" y="175" fill="#64748b" font-size="11" text-anchor="middle">3 &#xD7; 1</text>
  </g>

  <!-- Arrow 1: W^T -->
  <g transform="translate(180, 170)">
    <line x1="0" y1="15" x2="65" y2="15" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="32" y="0" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">Wᵀ</text>
    <text x="32" y="38" fill="#64748b" font-size="10" text-anchor="middle">3 &#xD7; 3</text>
  </g>

  <!-- Vector z_in & Activation f(.) -->
  <g transform="translate(265, 110)">
    <rect width="115" height="150" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="57" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">z<tspan font-size="10" dy="2">in</tspan><tspan dy="-2"> = Wᵀx</tspan></text>
    <text x="57" y="70" fill="#94a3b8" font-size="12" text-anchor="middle">z<tspan font-size="9" dy="2">1,in</tspan></text>
    <text x="57" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">z<tspan font-size="9" dy="2">2,in</tspan></text>
    <text x="57" y="130" fill="#94a3b8" font-size="12" text-anchor="middle">z<tspan font-size="9" dy="2">3,in</tspan></text>
    <text x="57" y="175" fill="#64748b" font-size="11" text-anchor="middle">3 &#xD7; 1</text>
  </g>

  <!-- Activation arrow -->
  <g transform="translate(395, 170)">
    <line x1="0" y1="15" x2="45" y2="15" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPink)"/>
    <text x="22" y="0" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">f(·)</text>
  </g>

  <!-- Vector z_out (with bias prepended) -->
  <g transform="translate(455, 100)">
    <rect width="115" height="170" rx="8" fill="#111827" stroke="#a855f7" stroke-width="1.8" filter="url(#softShadow)"/>
    <text x="57" y="26" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">Hidden z</text>
    <text x="57" y="60" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="middle">z<tspan font-size="9" dy="2">0</tspan><tspan dy="-2"> (bias=1)</tspan></text>
    <text x="57" y="90" fill="#f8fafc" font-size="12" text-anchor="middle">z<tspan font-size="9" dy="2">1</tspan></text>
    <text x="57" y="120" fill="#f8fafc" font-size="12" text-anchor="middle">z<tspan font-size="9" dy="2">2</tspan></text>
    <text x="57" y="150" fill="#f8fafc" font-size="12" text-anchor="middle">z<tspan font-size="9" dy="2">3</tspan></text>
    <text x="57" y="195" fill="#64748b" font-size="11" text-anchor="middle">4 &#xD7; 1</text>
  </g>

  <!-- Arrow 2: V^T -->
  <g transform="translate(585, 170)">
    <line x1="0" y1="15" x2="65" y2="15" stroke="#ff007a" stroke-width="2.5" marker-end="url(#arrowPink)"/>
    <text x="32" y="0" fill="#ff007a" font-size="14" font-weight="700" text-anchor="middle">Vᵀ</text>
    <text x="32" y="38" fill="#64748b" font-size="10" text-anchor="middle">2 &#xD7; 4</text>
  </g>

  <!-- Vector y_in & Output y -->
  <g transform="translate(670, 115)">
    <rect width="90" height="140" rx="8" fill="#111827" stroke="#ff007a" stroke-width="1.5"/>
    <text x="45" y="26" fill="#ff007a" font-size="13" font-weight="700" text-anchor="middle">y<tspan font-size="10" dy="2">in</tspan></text>
    <text x="45" y="70" fill="#94a3b8" font-size="12" text-anchor="middle">y<tspan font-size="9" dy="2">1,in</tspan></text>
    <text x="45" y="105" fill="#94a3b8" font-size="12" text-anchor="middle">y<tspan font-size="9" dy="2">2,in</tspan></text>
    <text x="45" y="165" fill="#64748b" font-size="11" text-anchor="middle">2 &#xD7; 1</text>
  </g>

  <!-- Activation arrow 2 -->
  <g transform="translate(775, 170)">
    <line x1="0" y1="15" x2="35" y2="15" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <text x="17" y="0" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">f(·)</text>
  </g>

  <!-- Final Prediction Vector y_out -->
  <g transform="translate(825, 115)">
    <rect width="70" height="140" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#softShadow)"/>
    <text x="35" y="26" fill="#10b981" font-size="14" font-weight="800" text-anchor="middle">y<tspan font-size="10" dy="2">out</tspan></text>
    <text x="35" y="70" fill="#10b981" font-size="14" font-weight="700" text-anchor="middle">y<tspan font-size="10" dy="2">1</tspan></text>
    <text x="35" y="105" fill="#10b981" font-size="14" font-weight="700" text-anchor="middle">y<tspan font-size="10" dy="2">2</tspan></text>
    <text x="35" y="165" fill="#64748b" font-size="11" text-anchor="middle">2 &#xD7; 1</text>
  </g>

  <!-- Bottom Dimension Match Formula -->
  <rect x="40" y="315" width="840" height="42" rx="8" fill="#111827" stroke="#1e293b"/>
  <text x="450" y="342" fill="#94a3b8" font-size="13" text-anchor="middle">
    <tspan fill="#00f0ff">z = f(Wᵀx)</tspan> where <tspan font-family="monospace">(3&#xD7;3) &#xD7; (3&#xD7;1) = (3&#xD7;1)</tspan>
    <tspan dx="40" fill="#ff007a">y = f(Vᵀz)</tspan> where <tspan font-family="monospace">(2&#xD7;4) &#xD7; (4&#xD7;1) = (2&#xD7;1)</tspan>
  </text>
</svg>