<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-size="19" font-weight="700">Backpropagation: Forward Activations vs. Backward Gradient Flow</text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">Activations propagate forward (cyan); Error signals &amp; gradients propagate backward via the chain rule (neon pink).</text>

  <!-- Legend -->
  <g transform="translate(560, 25)">
    <line x1="0" y1="12" x2="35" y2="12" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <text x="45" y="16" fill="#00f0ff" font-size="12" font-weight="600">Forward Pass (a)</text>

    <line x1="175" y1="12" x2="210" y2="12" stroke="#ff007a" stroke-width="2.5" marker-end="url(#arrowPink)"/>
    <text x="220" y="16" fill="#ff007a" font-size="12" font-weight="600">Backward Pass (δ)</text>
  </g>

  <!-- Column Headers -->
  <text x="140" y="98" fill="#00f0ff" font-size="13" font-weight="700" text-anchor="middle">Input Layer x</text>
  <text x="440" y="98" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">Hidden Layer h</text>
  <text x="740" y="98" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">Output Layer y</text>

  <!-- Forward Connections (offset slightly upward) -->
  <g stroke="#00f0ff" stroke-width="1.4" stroke-opacity="0.4" marker-end="url(#arrowCyan)">
    <!-- x -> h -->
    <line x1="164" y1="180" x2="416" y2="200"/>
    <line x1="164" y1="180" x2="416" y2="280"/>
    <line x1="164" y1="180" x2="416" y2="360"/>

    <line x1="164" y1="280" x2="416" y2="200"/>
    <line x1="164" y1="280" x2="416" y2="280"/>
    <line x1="164" y1="280" x2="416" y2="360"/>

    <line x1="164" y1="380" x2="416" y2="200"/>
    <line x1="164" y1="380" x2="416" y2="280"/>
    <line x1="164" y1="380" x2="416" y2="360"/>

    <!-- h -> y -->
    <line x1="464" y1="200" x2="716" y2="230"/>
    <line x1="464" y1="200" x2="716" y2="350"/>

    <line x1="464" y1="280" x2="716" y2="230"/>
    <line x1="464" y1="280" x2="716" y2="350"/>

    <line x1="464" y1="360" x2="716" y2="230"/>
    <line x1="464" y1="360" x2="716" y2="350"/>
  </g>

  <!-- Backward Connections (offset slightly downward) -->
  <g stroke="#ff007a" stroke-width="1.8" stroke-dasharray="5,4" stroke-opacity="0.75" marker-end="url(#arrowPink)">
    <!-- y -> h (Error propagation) -->
    <line x1="716" y1="250" x2="470" y2="220"/>
    <line x1="716" y1="250" x2="470" y2="300"/>
    <line x1="716" y1="250" x2="470" y2="380"/>

    <line x1="716" y1="370" x2="470" y2="220"/>
    <line x1="716" y1="370" x2="470" y2="300"/>
    <line x1="716" y1="370" x2="470" y2="380"/>

    <!-- h -> x (Gradient computation) -->
    <line x1="416" y1="220" x2="168" y2="200"/>
    <line x1="416" y1="300" x2="168" y2="300"/>
    <line x1="416" y1="380" x2="168" y2="400"/>
  </g>

  <!-- Nodes: Input Layer -->
  <g transform="translate(140, 180)">
    <circle r="22" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
    <text x="0" y="5" fill="#00f0ff" font-size="14" font-weight="700" text-anchor="middle">x<tspan font-size="10" dy="2">1</tspan></text>
  </g>
  <g transform="translate(140, 280)">
    <circle r="22" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
    <text x="0" y="5" fill="#00f0ff" font-size="14" font-weight="700" text-anchor="middle">x<tspan font-size="10" dy="2">2</tspan></text>
  </g>
  <g transform="translate(140, 380)">
    <circle r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" fill="#f59e0b" font-size="14" font-weight="700" text-anchor="middle">x<tspan font-size="10" dy="2">0</tspan></text>
    <text x="0" y="36" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Bias</text>
  </g>

  <!-- Nodes: Hidden Layer (shows h activation & delta error) -->
  <g transform="translate(440, 200)">
    <circle r="24" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">h<tspan font-size="9" dy="2">1</tspan></text>
    <rect x="28" y="-12" width="54" height="24" rx="4" fill="#1e293b" stroke="#ff007a" stroke-width="1"/>
    <text x="55" y="4" fill="#ff007a" font-size="11" font-weight="700" text-anchor="middle">δ<tspan font-size="8" dy="2">1</tspan><tspan font-size="8" dy="-4">(1)</tspan></text>
  </g>
  <g transform="translate(440, 280)">
    <circle r="24" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">h<tspan font-size="9" dy="2">2</tspan></text>
    <rect x="28" y="-12" width="54" height="24" rx="4" fill="#1e293b" stroke="#ff007a" stroke-width="1"/>
    <text x="55" y="4" fill="#ff007a" font-size="11" font-weight="700" text-anchor="middle">δ<tspan font-size="8" dy="2">2</tspan><tspan font-size="8" dy="-4">(1)</tspan></text>
  </g>
  <g transform="translate(440, 360)">
    <circle r="24" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">h<tspan font-size="9" dy="2">3</tspan></text>
    <rect x="28" y="-12" width="54" height="24" rx="4" fill="#1e293b" stroke="#ff007a" stroke-width="1"/>
    <text x="55" y="4" fill="#ff007a" font-size="11" font-weight="700" text-anchor="middle">δ<tspan font-size="8" dy="2">3</tspan><tspan font-size="8" dy="-4">(1)</tspan></text>
  </g>

  <!-- Nodes: Output Layer (Loss & Output Error) -->
  <g transform="translate(740, 240)">
    <circle r="26" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="0" y="6" fill="#10b981" font-size="15" font-weight="700" text-anchor="middle">y<tspan font-size="10" dy="2">1</tspan></text>
    <!-- Target label indicator -->
    <rect x="36" y="-20" width="90" height="20" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="81" y="-6" fill="#94a3b8" font-size="10" text-anchor="middle">Target t<tspan font-size="8" dy="2">1</tspan></text>
    <!-- Output Error delta2 -->
    <rect x="36" y="5" width="130" height="24" rx="4" fill="#1e293b" stroke="#ff007a" stroke-width="1.2"/>
    <text x="101" y="21" fill="#ff007a" font-size="11" font-weight="700" text-anchor="middle">δ<tspan font-size="8" dy="2">1</tspan><tspan font-size="8" dy="-4">(2)</tspan><tspan dy="2"> = (y</tspan><tspan font-size="8" dy="2">1</tspan><tspan dy="-2">-t</tspan><tspan font-size="8" dy="2">1</tspan><tspan dy="-2">)σ'</tspan></text>
  </g>

  <g transform="translate(740, 360)">
    <circle r="26" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="0" y="6" fill="#10b981" font-size="15" font-weight="700" text-anchor="middle">y<tspan font-size="10" dy="2">2</tspan></text>
    <rect x="36" y="-20" width="90" height="20" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="81" y="-6" fill="#94a3b8" font-size="10" text-anchor="middle">Target t<tspan font-size="8" dy="2">2</tspan></text>
    <rect x="36" y="5" width="130" height="24" rx="4" fill="#1e293b" stroke="#ff007a" stroke-width="1.2"/>
    <text x="101" y="21" fill="#ff007a" font-size="11" font-weight="700" text-anchor="middle">δ<tspan font-size="8" dy="2">2</tspan><tspan font-size="8" dy="-4">(2)</tspan><tspan dy="2"> = (y</tspan><tspan font-size="8" dy="2">2</tspan><tspan dy="-2">-t</tspan><tspan font-size="8" dy="2">2</tspan><tspan dy="-2">)σ'</tspan></text>
  </g>

  <!-- Bottom Chain Rule Equations Card -->
  <rect x="40" y="445" width="840" height="65" rx="8" fill="#111827" stroke="#1e293b"/>
  <text x="60" y="470" fill="#ff007a" font-size="12" font-weight="700">Gradients via Chain Rule:</text>
  <text x="60" y="493" fill="#94a3b8" font-size="12">
    Output Layer: <tspan fill="#f8fafc">∂E/∂w<tspan font-size="9" dy="2">ij</tspan><tspan font-size="9" dy="-4">(2)</tspan><tspan dy="2"> = δ</tspan><tspan font-size="9" dy="2">i</tspan><tspan font-size="9" dy="-4">(2)</tspan><tspan dy="2"> · h</tspan><tspan font-size="9" dy="2">j</tspan></tspan> 
    <tspan dx="35">Hidden Layer:</tspan> <tspan fill="#f8fafc">δ<tspan font-size="9" dy="2">j</tspan><tspan font-size="9" dy="-4">(1)</tspan><tspan dy="2"> = (∑ w</tspan><tspan font-size="9" dy="2">ij</tspan><tspan font-size="9" dy="-4">(2)</tspan><tspan dy="2"> δ</tspan><tspan font-size="9" dy="2">i</tspan><tspan font-size="9" dy="-4">(2)</tspan><tspan dy="2">) · σ'(z</tspan><tspan font-size="9" dy="2">j</tspan><tspan font-size="9" dy="-4">(1)</tspan><tspan dy="2">)</tspan></tspan>
    <tspan dx="35">Update:</tspan> <tspan fill="#00f0ff">w ← w - η(∂E/∂w)</tspan>
  </text>
</svg>