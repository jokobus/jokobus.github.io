<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="auto" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007a" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f0ff" />
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff007a" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>


  <!-- Header -->
  <text x="40" y="40" fill="#f8fafc" font-size="19" font-weight="700">Vectorized Backpropagation Dataflow</text>
  <text x="40" y="62" fill="#94a3b8" font-size="13">Layer-wise error propagation with transposition (Wᵀ) and element-wise Hadamard product (⊙).</text>

  <!-- Forward Pass Lane -->
  <rect x="40" y="85" width="840" height="150" rx="10" fill="#111827" fill-opacity="0.6" stroke="#1e293b"/>
  <text x="60" y="112" fill="#00f0ff" font-size="13" font-weight="700">FORWARD PASS</text>

  <!-- a^(l-1) -->
  <g transform="translate(100, 130)">
    <rect width="110" height="70" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1.8"/>
    <text x="55" y="32" fill="#00f0ff" font-size="14" font-weight="700" text-anchor="middle">a<tspan font-size="10" dy="-5">(l-1)</tspan></text>
    <text x="55" y="55" fill="#64748b" font-size="11" text-anchor="middle">Input Activations</text>
  </g>

  <!-- Arrow to z^(l) -->
  <g transform="translate(225, 155)">
    <line x1="0" y1="10" x2="85" y2="10" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <text x="42" y="-2" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">W<tspan font-size="9" dy="-4">(l)</tspan><tspan dy="4">a + b</tspan><tspan font-size="9" dy="-4">(l)</tspan></text>
  </g>

  <!-- z^(l) -->
  <g transform="translate(325, 130)">
    <rect width="110" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="55" y="32" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">z<tspan font-size="10" dy="-5">(l)</tspan></text>
    <text x="55" y="55" fill="#64748b" font-size="11" text-anchor="middle">Linear Sum</text>
  </g>

  <!-- Arrow to a^(l) -->
  <g transform="translate(450, 155)">
    <line x1="0" y1="10" x2="85" y2="10" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPink)"/>
    <text x="42" y="-2" fill="#a855f7" font-size="12" font-weight="700" text-anchor="middle">σ(z<tspan font-size="9" dy="-4">(l)</tspan><tspan dy="4">)</tspan></text>
  </g>

  <!-- a^(l) -->
  <g transform="translate(550, 130)">
    <rect width="110" height="70" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
    <text x="55" y="32" fill="#a855f7" font-size="14" font-weight="700" text-anchor="middle">a<tspan font-size="10" dy="-5">(l)</tspan></text>
    <text x="55" y="55" fill="#64748b" font-size="11" text-anchor="middle">Activation</text>
  </g>

  <!-- Forward to Output Loss -->
  <g transform="translate(675, 155)">
    <line x1="0" y1="10" x2="65" y2="10" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  </g>

  <g transform="translate(755, 130)">
    <rect width="100" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="32" fill="#10b981" font-size="14" font-weight="700" text-anchor="middle">Loss E</text>
    <text x="50" y="55" fill="#64748b" font-size="11" text-anchor="middle">½ ‖y - t‖²</text>
  </g>

  <!-- Backward Pass Lane -->
  <rect x="40" y="250" width="840" height="180" rx="10" fill="#111827" fill-opacity="0.6" stroke="#1e293b"/>
  <text x="60" y="278" fill="#ff007a" font-size="13" font-weight="700">BACKWARD GRADIENT PASS</text>

  <!-- delta^(l+1) -->
  <g transform="translate(720, 310)">
    <rect width="135" height="85" rx="8" fill="#0f172a" stroke="#ff007a" stroke-width="2"/>
    <text x="67" y="30" fill="#ff007a" font-size="15" font-weight="700" text-anchor="middle">δ<tspan font-size="10" dy="-5">(l+1)</tspan></text>
    <text x="67" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Error at layer l+1</text>
    <text x="67" y="72" fill="#ff007a" font-size="10" font-family="monospace" text-anchor="middle">(n_l+1 &#xD7; 1)</text>
  </g>

  <!-- Backward propagation arrow with W^T and Hadamard -->
  <g transform="translate(540, 345)">
    <line x1="165" y1="10" x2="30" y2="10" stroke="#ff007a" stroke-width="2.5" marker-end="url(#arrowPink)"/>
    <text x="100" y="-8" fill="#ff007a" font-size="12" font-weight="700" text-anchor="middle">(W<tspan font-size="9" dy="-4">(l+1)</tspan><tspan dy="4">)ᵀ · δ</tspan><tspan font-size="9" dy="-4">(l+1)</tspan></text>
  </g>

  <!-- delta^(l) equation box -->
  <g transform="translate(290, 305)">
    <rect width="230" height="95" rx="8" fill="#0f172a" stroke="#ff007a" stroke-width="2" filter="url(#softShadow)"/>
    <text x="115" y="28" fill="#ff007a" font-size="14" font-weight="800" text-anchor="middle">δ<tspan font-size="10" dy="-5">(l)</tspan> Error Vector</text>
    <text x="115" y="54" fill="#f8fafc" font-size="12" font-family="monospace" text-anchor="middle">δ<tspan font-size="9" dy="-4">(l)</tspan><tspan dy="4"> = [(W</tspan><tspan font-size="9" dy="-4">(l+1)</tspan><tspan dy="4">)ᵀ δ</tspan><tspan font-size="9" dy="-4">(l+1)</tspan><tspan dy="4">] </tspan><tspan fill="#00f0ff" font-weight="700">⊙</tspan><tspan> σ'(z</tspan><tspan font-size="9" dy="-4">(l)</tspan><tspan dy="4">)</tspan></text>
    <text x="115" y="78" fill="#00f0ff" font-size="11" text-anchor="middle">⊙ = Element-wise Hadamard Product</text>
  </g>

  <!-- Weight & Bias Gradient Box -->
  <g transform="translate(60, 305)">
    <rect width="190" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="95" y="26" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Weight Gradients</text>
    <text x="95" y="52" fill="#f8fafc" font-size="12" font-family="monospace" text-anchor="middle">∂E/∂W<tspan font-size="9" dy="-4">(l)</tspan><tspan dy="4"> = δ</tspan><tspan font-size="9" dy="-4">(l)</tspan><tspan dy="4"> (a</tspan><tspan font-size="9" dy="-4">(l-1)</tspan><tspan dy="4">)ᵀ</tspan></text>
    <text x="95" y="78" fill="#f8fafc" font-size="12" font-family="monospace" text-anchor="middle">∂E/∂b<tspan font-size="9" dy="-4">(l)</tspan><tspan dy="4"> = δ</tspan><tspan font-size="9" dy="-4">(l)</tspan></text>
  </g>

  <!-- Connecting arrow to weight gradient box -->
  <line x1="290" y1="352" x2="255" y2="352" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
</svg>